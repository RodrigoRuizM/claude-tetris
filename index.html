<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <div class="wrapper">
    <h1 class="title">CLAUDE TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Cambiar tema claro/oscuro">Light</button>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Menú de pausa -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button id="pause-resume-btn" class="menu-btn primary" type="button">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
        <button id="pause-controls-btn" class="menu-btn" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar</li>
          <li><span><kbd>Space</kbd></span> caída</li>
          <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
        </ul>
        <label class="start-level">
          <span class="label">NIVEL INICIAL</span>
          <select id="start-level-select"></select>
        </label>
        <p class="start-level-hint">Se aplica en la próxima partida</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
