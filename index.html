<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <div class="wrapper">
    <h1 class="title">CLAUDE TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Cambiar tema claro/oscuro">Light</button>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- Records: solo visible en game over -->
        <div id="gameover-records" class="records-section hidden">
          <p id="record-msg" class="record-msg hidden"></p>
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
            <button type="submit">Guardar</button>
          </form>
          <div class="records" data-records></div>
          <button type="button" class="records-reset">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de inicio con la tabla de records -->
    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">RÉCORDS</p>
        <div class="records-section">
          <div class="records" data-records></div>
          <button type="button" class="records-reset">Borrar records</button>
        </div>
        <button id="play-btn" class="primary-btn" type="button">Jugar</button>
        <p class="start-hint">Pulsa <kbd>Enter</kbd> para jugar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
